<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mening Profilim</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background-color: var(--card-bg);
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 350px;
      width: 90%;
      border: 1px solid #334155;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      margin-bottom: 1rem;
    }

    h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.5rem;
    }

    p {
      color: #94a3b8;
      margin: 0 0 1.5rem 0;
      font-size: 0.95rem;
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.75rem 0;
      background-color: var(--accent);
      color: #0f172a;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      transition: opacity 0.2s;
      border: none;
      cursor: pointer;
    }

    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="card">
    <img class="avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Developer" alt="Avatar">
    <h1>Ismingizni Yozing</h1>
    <p>Frontend / Backend Dasturchi</p>
    <button class="btn" onclick="sayHello()">Aloqa</button>
  </div>

  <script>
    function sayHello() {
      alert("Xabar yuborildi! Tez orada bog'lanaman.");
    }
  </script>

</body>
</html>
